services:
  movie-cataloguer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: movie-cataloguer

    ports:
      - "5000:5000"

    environment:
      TZ: America/New_York
      SECRET_KEY: "CHANGE_ME"
      TMDB_API_KEY: "YOUR_API_KEY"

    volumes:
      - ./data:/data

    restart: unless-stopped
